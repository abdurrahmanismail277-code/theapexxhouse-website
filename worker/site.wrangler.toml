name = "apex-house-site"
main = "src/site.js"
compatibility_date = "2026-10-26"

[assets]
directory = ".."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# Replace with the public key from your Google reCAPTCHA v2 checkbox registration.
RECAPTCHA_SITE_KEY = "REPLACE_WITH_GOOGLE_RECAPTCHA_V2_SITE_KEY"
